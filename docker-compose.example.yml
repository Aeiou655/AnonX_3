# Optional multi-service layout for AnonX.
# Default production path remains: single container / Dockerfile + start.
# Copy to docker-compose.yml and adjust secrets — do not commit real keys.

services:
  bot:
    build:
      context: .
      args:
        WITH_CHROMIUM: 0
        WITH_FIREFOX: 1
    env_file: .env
    restart: unless-stopped
    volumes:
      - media_data:/app/media
      - downloads_data:/app/downloads
      - ./AnonX/cookies:/app/AnonX/cookies
      - "${COOKIE_BROWSER_PROFILE_HOST:-/root/firefox-profile}:/root/firefox-profile:ro"
      - "${YOUTUBE_COOKIE_FILE_HOST:-/root/youtube-cookies.txt}:/root/youtube-cookies.txt:ro"
    ports:
      # Optional health (set HEALTH_PORT=9100 in .env)
      - "9100:9100"
      # Optional built-in CDN origin if bound to a fixed port
      # - "8088:8088"
    environment:
      HEALTH_PORT: 9100
      HEALTH_HOST: 0.0.0.0
      SINGLEFLIGHT_BACKEND: memory
      COOKIE_FREE_MODE: ${COOKIE_FREE_MODE:-False}
      COOKIE_AUTH_RECOVERY_ENABLED: ${COOKIE_AUTH_RECOVERY_ENABLED:-False}
      AUTO_COOKIE_ENABLED: ${AUTO_COOKIE_ENABLED:-False}
      COOKIE_BROWSER: ${COOKIE_BROWSER:-firefox}
      COOKIE_BROWSER_PROFILE: /root/firefox-profile
      COOKIE_BROWSER_WARMUP: ${COOKIE_BROWSER_WARMUP:-False}
      YOUTUBE_COOKIE_FILE: ${YOUTUBE_COOKIE_FILE:-/root/youtube-cookies.txt}
      YTDLP_BINARY: ${YTDLP_BINARY:-/usr/local/bin/yt-dlp}
      YTDLP_JS_RUNTIME: ${YTDLP_JS_RUNTIME:-deno:/usr/local/bin/deno}
      YTDLP_REMOTE_COMPONENTS: ${YTDLP_REMOTE_COMPONENTS:-ejs:github}
      PO_TOKEN_PROVIDER_ENABLED: ${PO_TOKEN_PROVIDER_ENABLED:-True}
      PO_TOKEN_PROVIDER_URL: http://po-provider:4416
      # - REDIS_URL=redis://redis:6379/0
      # - SINGLEFLIGHT_BACKEND=redis
    depends_on:
      po-provider:
        condition: service_healthy

  po-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    restart: unless-stopped
    ports:
      - "${PO_TOKEN_PUBLISH_PORT:-127.0.0.1:4416}:4416"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # redis:
  #   image: redis:7-alpine
