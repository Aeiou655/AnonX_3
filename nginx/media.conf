# Optional Nginx static origin for AnonX media/ready
# Use when you have a domain / want sendfile + range outside the bot process.
# Default bot path uses built-in aiohttp origin (CDN_ORIGIN_*) — no Nginx required.

# Define rate-limit zone in http {} block of main nginx.conf:
#   limit_req_zone $binary_remote_addr zone=AnonX_media:10m rate=10r/s;
#   limit_conn_zone $binary_remote_addr zone=AnonX_conn:10m;

# Map this server_name / listen as needed. Example only.

server {
    listen 8080;
    server_name _;

    # Jail to ready media only
    root /var/www/AnonX/media/ready;

    # No directory listing
    autoindex off;

    # Efficient file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Connection limits (define zone in http {}):
    # limit_conn AnonX_conn 20;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache for public CDN-like behavior (adjust as needed)
    location /media/ {
        alias /var/www/AnonX/media/ready/;
        # Only serve files, no path traversal
        disable_symlinks if_not_owner;

        types {
            audio/webm webm;
            audio/mp4 m4a;
            audio/mpeg mp3;
            audio/ogg ogg opus;
            video/mp4 mp4;
            video/webm webm;
            video/x-matroska mkv;
        }
        default_type application/octet-stream;

        # Cache-Control for CDN edge / browser
        add_header Cache-Control "public, max-age=3600" always;
        add_header Accept-Ranges bytes;

        # Optional rate limiting (define zone in http {}):
        # limit_req zone=AnonX_media burst=20 nodelay;
        # limit_rate 2m;

        # Internal redirect support for X-Accel-Redirect
        # When bot serves via aiohttp, set X-Accel-Redirect header
        # to offload file delivery to Nginx without proxying bytes:
        #
        #   location /internal_media/ {
        #       internal;
        #       alias /var/www/AnonX/media/ready/;
        #   }
        #
        # Bot then responds with:
        #   X-Accel-Redirect: /internal_media/<filename>
        # and Nginx serves the static file directly.
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # Deny hidden / backup
    location ~ /\. {
        deny all;
    }

    # Deny direct access to temp and metadata dirs
    location ~ ^/(tmp|metadata|logs)/ {
        deny all;
    }
}

# Notes:
# - Cloudflare does NOT automatically cache large audio/video; configure Cache Rules if needed.
# - Point CDN_PUBLIC_BASE_URL=https://your.domain (optional).
# - Without a domain, keep CDN_ORIGIN_ENABLED=auto and skip Nginx.
# - For X-Accel-Redirect: bot replies with the header; Nginx intercepts and serves
#   the file from the internal location without the bot handling file bytes.
